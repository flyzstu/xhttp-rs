name: Promote image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable image tag
        required: true
        type: string
      target_tag:
        description: Version tag to create
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          tag_pattern='^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          [[ "$SOURCE_TAG" =~ $tag_pattern ]] || exit 1
          [[ "$TARGET_TAG" =~ $tag_pattern ]] || exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote immutable image
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            --tag "$image:$TARGET_TAG" \
            "$image:$SOURCE_TAG"
